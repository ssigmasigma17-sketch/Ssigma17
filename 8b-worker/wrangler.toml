# Сервер для сайту 8-Б (сторінка лежить на GitHub Pages у гілці gh-pages, папка 8b/).
# Зберігає броні парт і домашку. Cloudflare: Workers → Import a repository → коренева папка 8b-worker.
name = "class-8b"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# Пробні збірки з інших гілок (npx wrangler preview) вимагають цей блок, хай і порожній.
[previews]

# Нагадування Telegram-бота о 7:00 і 19:00 за Києвом. Запусків по два, бо взимку й улітку різниця з UTC різна;
# зайвий запуск бот сам пропускає (bot.js, tgDaily).
[triggers]
crons = ["0 4,5 * * 1-5", "0 16,17 * * 0-4"]
