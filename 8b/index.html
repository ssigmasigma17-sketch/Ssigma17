<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8-Б</title>
<meta name="description" content="Бронювання парт, розклад уроків і дзвінків 8-Б">
<meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16201c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="8-Б">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

<header class="hero">
  <div class="hero-top">
    <h1 class="klass" aria-label="Клас 8-Б"><span class="ch">8</span><span class="dash">-</span><span class="ch">Б</span></h1>
    <div class="hero-date">
      <div class="tools">
        <button type="button" class="icon-btn" id="share" aria-label="Поділитися посиланням">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        </button>
        <button type="button" class="icon-btn" id="theme" aria-label="Тема: як у телефоні">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path class="half" d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></svg>
        </button>
      </div>
      <span id="today-dow" class="dow"></span>
      <span id="today-date" class="date"></span>
      <span id="clock" class="clock mono"></span>
    </div>
  </div>

  <section class="now" id="now" aria-live="polite">
    <div class="now-label" id="now-label"></div>
    <div class="now-main">
      <div class="now-title" id="now-title"></div>
      <div class="now-count mono" id="now-count"></div>
    </div>
    <div class="now-sub" id="now-sub"></div>
    <div class="ruler" id="ruler" hidden>
      <div class="ruler-fill" id="ruler-fill"></div>
      <div class="ruler-ticks"></div>
    </div>
  </section>

  <button type="button" class="strip" id="strip" aria-label="Відкрити розклад">
    <span class="strip-head">
      <span class="strip-title" id="strip-title"></span>
      <span class="strip-left mono" id="strip-left"></span>
    </span>
    <span class="strip-track" id="strip-track"></span>
    <span class="strip-axis mono"><span id="strip-from"></span><span id="strip-weekend" class="strip-weekend"></span><span id="strip-to"></span></span>
  </button>
</header>

<nav class="tabs" role="tablist" aria-label="Розділи">
  <button role="tab" id="tab-desks" data-tab="desks" aria-selected="true">Парти</button>
  <button role="tab" id="tab-week" data-tab="week" aria-selected="false">Розклад</button>
  <button role="tab" id="tab-bells" data-tab="bells" aria-selected="false">Дзвінки</button>
</nav>

<main>
  <!-- Парти -->
  <section class="panel" id="panel-desks" role="tabpanel" aria-labelledby="tab-desks">
    <div class="days" id="days" role="radiogroup" aria-label="День"></div>

    <div class="room-head">
      <div>
        <div class="eyebrow">План класу</div>
        <div class="room-day" id="room-day"></div>
      </div>
      <div class="tally" id="tally"></div>
    </div>

    <div class="room" id="room">
      <div class="rows" id="rows"></div>
    </div>

    <div class="legend">
      <span><i class="sw sw-free"></i>вільно</span>
      <span><i class="sw sw-taken"></i>зайнято</span>
      <span><i class="sw sw-mine"></i>твоє</span>
      <span class="sync mono" id="sync"></span>
    </div>

    <div class="demo" id="demo" hidden>
      Поки що броні зберігаються лише на цьому телефоні: спільний сервер ще не підключено.
    </div>

    <section class="rules">
      <h2 class="h2">Правила</h2>
      <ol id="rules"></ol>
    </section>
  </section>

  <!-- Розклад -->
  <section class="panel" id="panel-week" role="tabpanel" aria-labelledby="tab-week" hidden>
    <div class="days days-week" id="week-days" role="radiogroup" aria-label="День тижня"></div>
    <div class="week" id="week"></div>
  </section>

  <!-- Дзвінки -->
  <section class="panel" id="panel-bells" role="tabpanel" aria-labelledby="tab-bells" hidden>
    <ol class="bells" id="bells"></ol>
  </section>
</main>

<footer class="foot">
  <span>8-Б · <span id="year"></span></span>
  <span>Розклад з rozklad.org, станом на 31.08.2026</span>
</footer>

</div>

<!-- Аркуш бронювання -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip"></div>
  <div class="sheet-eyebrow" id="sheet-eyebrow"></div>
  <h3 class="sheet-title" id="sheet-title"></h3>
  <p class="sheet-text" id="sheet-text"></p>
  <form id="sheet-form" autocomplete="off">
    <label class="field" for="name-input">
      <span>Імʼя та прізвище</span>
      <input id="name-input" name="name" maxlength="32" placeholder="Як тебе підписати на парті" required>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="sheet-cancel">Закрити</button>
      <button type="submit" class="btn primary" id="sheet-submit">Забронювати</button>
    </div>
  </form>
  <div class="sheet-actions" id="sheet-mine" hidden>
    <button type="button" class="btn ghost" id="sheet-close">Закрити</button>
    <button type="button" class="btn danger" id="sheet-release">Звільнити місце</button>
  </div>
  <p class="sheet-error" id="sheet-error" role="alert"></p>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
