name: Dashboard events
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-events.mjs
      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"; git config user.email "bot@users.noreply.github.com"
          git add dashboard/events.json
          git diff --cached --quiet || (git commit -m "Update events" && git push)
