<title>Симулятор камеры</title>
<meta name="description" content="Симулятор камеры телефона: зум, режимы, выдержка, диафрагма, ISO, фокус касанием и галерея снимков.">
<style>
/* Layout: one phone-sized camera screen — top bar, 3:4 viewfinder with overlaid controls, mode carousel, shutter row. Single dark look by choice. */
:root {
  --bg: #000;
  --fg: #fff;
  --dim: rgba(255,255,255,.62);
  --glass: rgba(28,28,30,.62);
  --glass-2: rgba(58,58,62,.78);
  --accent: #ffd426;
  --warn: #ff9f43;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); height: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; padding-inline: 16px; padding-block: 12px; display: grid; place-items: start center; overflow-x: hidden; }
button { font-family: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.phone { width: min(430px, 100%, max(300px, calc((100dvh - 250px) * .75))); display: grid; user-select: none; -webkit-user-select: none; }

/* top bar */
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 46px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-2); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.on { background: var(--accent); color: #000; }
.chev { justify-self: center; width: 36px; height: 26px; border-radius: 13px; display: grid; place-items: center; }
.chev svg { width: 22px; height: 12px; transition: transform .25s; }
.chev[aria-expanded="true"] svg { transform: rotate(180deg); }
.chev[aria-expanded="true"] { background: var(--glass-2); }
.top .right { justify-self: end; }

.readout { display: flex; justify-content: center; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--dim); height: 22px; align-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.readout .meter { color: var(--fg); }
.readout .meter.bad { color: var(--warn); }
.readout .auto { color: var(--accent); }

/* viewfinder */
.vf { position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 100%; overflow: hidden; background: #111; touch-action: none; cursor: crosshair; }
.vf canvas#view { display: block; width: 100%; height: 100%; }
.gridlines { position: absolute; inset: 0; pointer-events: none; }
.gridlines i { position: absolute; background: rgba(255,255,255,.28); }
.af { position: absolute; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 1.5px solid var(--accent); pointer-events: none; transition: opacity .6s; }
.af.dim { opacity: .35; }
.af.pop { animation: afpop .35s ease-out; }
@keyframes afpop { 0% { transform: translate(-50%, -50%) scale(1.35); } 100% { transform: translate(-50%, -50%) scale(1); } }
.af .sunline { position: absolute; right: -18px; top: 0; bottom: 0; width: 1.5px; background: var(--accent); opacity: .7; }
.af .sun { position: absolute; right: -26px; width: 17px; height: 17px; margin-top: -8px; color: var(--accent); }
.af .tag { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); background: var(--accent); color: #000; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--fg); font-size: 12.5px; line-height: 1.3; padding: 6px 12px; border-radius: 14px; text-align: center; pointer-events: none; }
.hint b { color: var(--warn); font-weight: 600; }
.histo { position: absolute; top: 48px; left: 10px; width: 30%; height: auto; aspect-ratio: 2 / 1; background: var(--glass); border-radius: 8px; pointer-events: none; }
.blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.blackout.go { animation: blink .22s ease-out; }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }

.overlay { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 10px; padding-block: 28px 12px; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); cursor: default; }
.zoom { justify-self: center; display: flex; gap: 6px; background: rgba(0,0,0,.32); padding: 4px; border-radius: 22px; }
.zoom button { width: 32px; height: 32px; border-radius: 50%; background: var(--glass-2); font-size: 11px; font-weight: 600; display: grid; place-items: center; transition: transform .15s; }
.zoom button.on { color: var(--accent); transform: scale(1.18); font-size: 12px; }

.tools { display: flex; gap: 6px; overflow-x: auto; padding-inline: 12px; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool { flex: none; display: grid; justify-items: center; gap: 4px; width: 54px; }
.tool .ring { width: 38px; height: 38px; border-radius: 50%; background: var(--glass-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.tool span { font-size: 10px; color: var(--dim); white-space: nowrap; }
.tool[aria-pressed="true"] .ring { background: var(--fg); color: #000; }
.tool.on .ring { color: var(--accent); }
.tool[aria-pressed="true"].on .ring { background: var(--accent); color: #000; }

.dial { display: grid; gap: 6px; }
.dial-label { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.dial-label b { color: var(--accent); font-family: var(--mono); letter-spacing: 0; margin-left: 6px; text-transform: none; }
.dial-label em { font-style: normal; color: var(--fg); margin-left: 6px; letter-spacing: 0; text-transform: none; font-weight: 500; }
.ruler { position: relative; height: 40px; overflow: hidden; cursor: ew-resize; touch-action: none;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent); }
.ruler.off { opacity: .4; cursor: not-allowed; }
.track { position: absolute; left: 50%; top: 0; height: 100%; will-change: transform; }
.tick { position: absolute; top: 4px; width: 1.5px; height: 12px; background: rgba(255,255,255,.55); transform: translateX(-50%); }
.tick.major { height: 18px; background: #fff; }
.tick b { position: absolute; top: 21px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 500; white-space: nowrap; font-family: var(--mono); color: var(--dim); }
.needle { position: absolute; left: 50%; top: 0; width: 2px; height: 22px; margin-left: -1px; background: var(--accent); border-radius: 1px; }

/* modes */
.modes { height: 44px; overflow: hidden; position: relative; touch-action: pan-y; }
.mode-track { position: absolute; top: 0; left: 0; display: flex; gap: 22px; height: 100%; align-items: center; transition: transform .28s ease; white-space: nowrap; }
.mode-track button { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--dim); padding: 8px 0; }
.mode-track button[aria-pressed="true"] { color: var(--accent); }

/* bottom row */
.bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 6px 18px; padding-inline: 18px; }
.thumb { width: 46px; height: 46px; border-radius: 8px; overflow: hidden; background: #1c1c1e; border: 1px solid rgba(255,255,255,.14); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.pop img { animation: thumbin .35s ease-out; }
@keyframes thumbin { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
.shutter i { width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .1s; }
.shutter:active i { transform: scale(.88); }
.cycle { justify-self: end; width: 46px; height: 46px; border-radius: 50%; background: var(--glass-2); display: grid; place-items: center; }
.cycle svg { width: 24px; height: 24px; }

/* toast */
.toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; pointer-events: none; transition: opacity .3s; opacity: 0; }
.toast.show { opacity: 1; }

/* gallery */
.gallery { position: fixed; inset: 0; background: #000; z-index: 20; display: grid; grid-template-rows: auto 1fr auto auto; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-bottom, 0px) + 12px); }
.g-top { display: flex; justify-content: space-between; align-items: center; height: 44px; max-width: 700px; width: 100%; margin: 0 auto; }
.g-top button { color: var(--accent); font-size: 16px; font-weight: 600; }
.g-top span { font-size: 14px; color: var(--dim); }
.g-main { display: grid; place-items: center; min-height: 0; }
.g-main img { max-width: 100%; max-height: 100%; object-fit: contain; }
.g-cap { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--dim); padding-block: 10px; font-variant-numeric: tabular-nums; }
.g-strip { display: flex; gap: 4px; overflow-x: auto; justify-content: safe center; }
.g-strip button { flex: none; width: 48px; height: 64px; opacity: .55; }
.g-strip button.on { opacity: 1; outline: 2px solid var(--fg); }
.g-strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.g-empty { color: var(--dim); }

@media (prefers-reduced-motion: reduce) { .mode-track, .af, .chev svg { transition: none; } .blackout.go, .af.pop, .thumb.pop img { animation: none; } }
</style>

<div class="phone" id="phone">
  <div class="top">
    <button class="icon-btn" id="flashBtn" aria-label="Вспышка" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.2 2 5 13.4h5.6L9.4 22 18 10.2h-5.7L13.2 2Z"/></svg>

      <svg viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10 11 2l9 8"/></svg>
    </button>
    <button class="icon-btn right" id="histBtn" aria-label="Гистограмма" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="13" width="3" height="8" rx="1"/><rect x="8" y="8" width="3" height="13" rx="1"/><rect x="13" y="4" width="3" height="17" rx="1"/><rect x="18" y="10" width="3" height="11" rx="1"/></svg>

      <svg class="sun" id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>

</div>

<div class="toast" id="toast"></div>

  <div class="g-top"><span id="gCount"></span><button type="button" id="gDone">Готово</button></div>

  <div class="g-strip" id="gStrip"></div>
</div>

<script>
(() => {
'use strict';
const W = 900, H = 1200;
const PXMM = H / 36;      // the long side of the frame maps to 36 mm (full-frame equivalent)
const COC = 0.03;         // circle of confusion, mm
const SUBJECT_D = 5;      // distance to the person, m
const BASE_F = 26;        // "1×" lens, mm equivalent
const XA = -W * .75, XB = W * 1.75, YA = -H * .8, YB = H * 1.6; // scene extent, enough for 0.5×

const SHUTTERS = [30,25,20,15,13,10,8,6,5,4,3.2,2.5,2,1.6,1.3,1,0.8,0.6,0.5,0.4,0.3,1/4,1/5,1/6,1/8,1/10,1/13,1/15,1/20,1/25,1/30,1/40,1/50,1/60,1/80,1/100,1/125,1/160,1/200,1/250,1/320,1/400,1/500,1/640,1/800,1/1000,1/1250,1/1600,1/2000,1/2500,1/3200,1/4000,1/5000,1/6400,1/8000];
const APERTURES = [1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22];
const ISOS = [50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800];
const FOCALS = [13,15,18,20,22,24,26,28,32,35,40,45,52,58,65,70,77,85,100,120,135,150,170,200];
const FOCI = [0.3,0.4,0.5,0.6,0.7,0.8,1,1.2,1.4,1.7,2,2.5,3,4,5,6,8,10,14,20,30,50,100,Infinity];

const LIGHTS = {
  sunny:    { name: 'Солнце',      ev: 15, tint: [1, 1, 1],       sky: ['#2f73d0', '#a8d0f2'], sun: { x: .82, y: .12, r: 34, c: '#fffbe6', glow: 'rgba(255,250,220,.55)' }, shadow: .28 },
  overcast: { name: 'Пасмурно',    ev: 12, tint: [.8, .82, .86],  sky: ['#8f98a3', '#cfd3d8'], shadow: 0 },
  golden:   { name: 'Закат',       ev: 11, tint: [1, .8, .6],     sky: ['#44589a', '#f7a458'], sun: { x: .15, y: .44, r: 46, c: '#ffd9a0', glow: 'rgba(255,170,90,.6)' }, shadow: .2 },
  dusk:     { name: 'Сумерки',     ev: 7,  tint: [.42, .47, .66], sky: ['#1b2856', '#a05f78'], lamps: .7, shadow: 0 },
  night:    { name: 'Ночь',        ev: 4,  tint: [.2, .23, .38],  sky: ['#040816', '#18234a'], lamps: 1, stars: true, shadow: 0 },
};
const LIGHT_KEYS = Object.keys(LIGHTS);
const SPEEDS = [ { v: 0, name: 'Стоит' }, { v: 1.4, name: 'Идёт' }, { v: 5, name: 'Бежит' }, { v: 9, name: 'Велосипед' } ];

// Phone-style modes mapped onto real exposure programs.
const MODES = [
  { key: 'tv',    label: 'ВЫДЕРЖКА',  prog: 'Tv' },
  { key: 'port',  label: 'ПОРТРЕТ',   prog: 'Av' },
  { key: 'photo', label: 'ФОТО',      prog: 'P' },
  { key: 'pro',   label: 'ПРО',       prog: 'M' },
  { key: 'av',    label: 'ДИАФРАГМА', prog: 'Av' },
];

const S = { mode: 'photo', si: 44, ai: 3, ii: 3, autoIso: true, comp: 0, focal: 26, focus: SUBJECT_D, light: 'sunny', speed: 0, tripod: false, flash: false, grid: true };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const log2 = Math.log2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function nearest(arr, v) { let bi = 0, bd = Infinity; arr.forEach((a, i) => { const d = !isFinite(a) || !isFinite(v) ? (a === v ? 0 : Infinity) : Math.abs(Math.log(a) - Math.log(v)); if (d < bd) { bd = d; bi = i; } }); return bi; }
const fmtT = t => t >= 0.3 ? `${+t.toFixed(1)}″` : `1/${Math.round(1 / t)}`;
const fmtN = n => `ƒ${n}`;
const fmtComp = c => { if (c === 0) return '0'; const s = c > 0 ? '+' : '−', a = Math.abs(c), w = Math.floor(a / 3), r = a % 3; return s + (w ? w : '') + (r ? (w ? ' ' : '') + r + '/3' : ''); };
const fmtM = d => !isFinite(d) ? '∞' : d >= 10 ? `${Math.round(d)} м` : `${+d.toFixed(1)} м`;
const fmtZ = f => { const z = f / BASE_F; return (z < 1 ? z.toFixed(1).replace(/^0/, '') : (Math.round(z * 10) / 10).toString().replace('.0', '')) + '×'; };
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const prog = () => MODES.find(m => m.key === S.mode).prog;

// ---------- exposure ----------
function solve(iso) {
  const L = LIGHTS[S.light], P = prog();
  const target = L.ev + log2(iso / 100) - S.comp / 3;
  let si = S.si, ai = S.ai, rawN = null;
  if (P === 'Av') si = nearest(SHUTTERS, APERTURES[ai] ** 2 / 2 ** target);
  else if (P === 'Tv') { rawN = Math.sqrt(SHUTTERS[si] * 2 ** target); ai = nearest(APERTURES, rawN); }
  else if (P === 'P') { ai = nearest(APERTURES, Math.sqrt(2 ** clamp(target / 2 - 1.5, 1, 8.9))); si = nearest(SHUTTERS, APERTURES[ai] ** 2 / 2 ** target); }
  if (S.flash && SHUTTERS[si] < 1 / 250 && P !== 'M' && P !== 'Tv') si = SHUTTERS.indexOf(1 / 250); // flash sync limit
  return { si, ai, iso, rawN };
}
function compute() {
  const L = LIGHTS[S.light], P = prog();
  let r;
  if (!S.autoIso) r = solve(ISOS[S.ii]);
  else if (P === 'M') {
    const N = APERTURES[S.ai], t = SHUTTERS[S.si];
    r = { si: S.si, ai: S.ai, iso: ISOS[nearest(ISOS, clamp(100 * 2 ** (log2(N * N / t) - L.ev + S.comp / 3), 50, 12800))] };
  } else {
    const handheld = S.tripod ? 30 : 1 / S.focal;
    for (const iso of ISOS) {
      if (iso < 100 && !(L.ev >= 13)) continue;
      r = solve(iso);
      const ok = P === 'Tv' ? (r.rawN === null || r.rawN >= 1.4 / 1.12) : SHUTTERS[r.si] <= handheld * 1.12;
      if (ok) break;
    }
  }
  const t = SHUTTERS[r.si], N = APERTURES[r.ai], iso = r.iso;
  return { t, N, iso, si: r.si, ai: r.ai, offset: L.ev + log2(iso / 100) - log2(N * N / t) };
}

// ---------- optics ----------
function cocPx(D, N, f, s) {
  const Dm = D * 1000, Sm = s * 1000;
  const b = (f * f / N) * Math.abs(1 / Dm - (isFinite(Sm) ? 1 / Sm : 0)) / (isFinite(Sm) ? (1 - f / Sm) : 1);
  return b * PXMM;
}
function dof(N, f, s) {
  const Hf = f * f / (N * COC) + f;
  if (!isFinite(s)) return { near: Hf / 1000, far: Infinity };
  const Sm = s * 1000;
  return { near: Sm * (Hf - f) / (Hf + Sm - 2 * f) / 1000, far: Sm < Hf ? Sm * (Hf - f) / (Hf - Sm) / 1000 : Infinity };
}

// ---------- scene ----------
let TINT = [1, 1, 1], LIFT = 1;
function shade(hex, k = 1) {
  const n = parseInt(hex.slice(1), 16); k *= LIFT;
  const r = ((n >> 16) & 255) * Math.min(1, TINT[0] * k), g = ((n >> 8) & 255) * Math.min(1, TINT[1] * k), b = (n & 255) * Math.min(1, TINT[2] * k);
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const HZ = H * .5; // horizon

function drawFar(c, L) {
  const g = c.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  c.fillStyle = g; c.fillRect(XA, YA, XB - XA, YB - YA);
  const rnd = mulberry(7);
  if (L.stars) {

});
const endDrag = () => { if (dragging) { dragging = null; updateDial(true); } };
ruler.addEventListener('pointerup', endDrag); ruler.addEventListener('pointercancel', endDrag);
ruler.addEventListener('wheel', e => { if (!activeDial || !DIALS[activeDial].enabled()) return; e.preventDefault(); setDial(DIALS[activeDial].get() + Math.sign(e.deltaY || e.deltaX)); }, { passive: false });
ruler.addEventListener('keydown', e => {
  if (!activeDial || !DIALS[activeDial].enabled()) return;
  if (e.key === 'ArrowLeft') { setDial(DIALS[activeDial].get() - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { setDial(DIALS[activeDial].get() + 1); e.preventDefault(); }
});

// tools row
const TOOL_KEYS = ['ev', 'shutter', 'aperture', 'iso', 'focus', 'zoom', 'light', 'motion', 'tripod', 'grid'];
$('tools').innerHTML = TOOL_KEYS.map(k => {
  const D = DIALS[k];
  const glyph = D ? D.glyph : k === 'tripod' ? '⊥' : '#';
  const label = D ? D.label : k === 'tripod' ? 'Штатив' : 'Сетка';
  return `<button type="button" class="tool" data-k="${k}" aria-pressed="false"><span class="ring">${glyph}</span><span>${label}</span></button>`;
}).join('');
$('tools').addEventListener('click', e => {
  const b = e.target.closest('.tool'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'tripod') { S.tripod = !S.tripod; toast(S.tripod ? 'Штатив: камера неподвижна' : 'Съёмка с рук'); schedule(); }
  else if (k === 'grid') { S.grid = !S.grid; $('gridlines').hidden = !S.grid; }
  else openDial(k);
  syncTools();
});
function syncTools() {
  document.querySelectorAll('.tool').forEach(b => {
    const k = b.dataset.k;
    b.setAttribute('aria-pressed', k === activeDial || (k === 'tripod' && S.tripod) || (k === 'grid' && S.grid));
    b.classList.toggle('on', (k === 'ev' && S.comp !== 0) || (k === 'iso' && !S.autoIso) || (k === 'focus' && S.focus !== SUBJECT_D));
  });
}
$('chev').addEventListener('click', () => {
  const open = $('tools').hidden;
  $('tools').hidden = !open; $('chev').setAttribute('aria-expanded', open);
  if (!open && activeDial) openDial(activeDial);
});

// zoom pills
const PILLS = [13, 26, 52, 77];
$('zoom').innerHTML = PILLS.map(f => `<button type="button" data-f="${f}">${fmtZ(f).replace('×', '')}</button>`).join('');
$('zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.focal = +b.dataset.f; schedule(); });
function syncZoom() {
  let act = 0; PILLS.forEach((f, i) => { if (S.focal >= f) act = i; });
  [...$('zoom').children].forEach((b, i) => {
    b.classList.toggle('on', i === act);
    b.textContent = i === act ? fmtZ(S.focal) : fmtZ(PILLS[i]).replace('×', '');
  });
}

// modes carousel
const modeTrack = $('modeTrack');
modeTrack.innerHTML = MODES.map(m => `<button type="button" data-m="${m.key}">${m.label}</button>`).join('');
function setMode(key) {
  if (last) { S.si = last.si; S.ai = last.ai; }
  S.mode = key;
  if (key === 'port') { S.ai = APERTURES.indexOf(1.8); S.focal = Math.max(S.focal, 52); S.focus = SUBJECT_D; toast('Портрет: ƒ1.8, фон размыт'); }
  if (key === 'photo') { S.autoIso = true; }
  schedule(); syncModes();
}
function syncModes() {
  const btns = [...modeTrack.children];
  btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.m === S.mode));
  const b = btns.find(b => b.dataset.m === S.mode), w = $('modes').clientWidth;
  modeTrack.style.transform = `translateX(${w / 2 - (b.offsetLeft + b.offsetWidth / 2)}px)`;
}
modeTrack.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
function stepMode(dir) { const i = MODES.findIndex(m => m.key === S.mode); const n = MODES[clamp(i + dir, 0, MODES.length - 1)]; if (n.key !== S.mode) setMode(n.key); }
let mSwipe = null;
$('modes').addEventListener('pointerdown', e => { mSwipe = e.clientX; });
$('modes').addEventListener('pointerup', e => { if (mSwipe !== null && Math.abs(e.clientX - mSwipe) > 30) stepMode(e.clientX < mSwipe ? 1 : -1); mSwipe = null; });
addEventListener('resize', () => { syncModes(); });

// viewfinder: tap to focus, vertical drag for exposure, horizontal swipe for modes
const vf = $('vf'), af = $('af');
let vfPtr = null, afTimer = 0;
vf.addEventListener('pointerdown', e => {
  if (e.target.closest('.overlay')) return;
  vf.setPointerCapture(e.pointerId);
  vfPtr = { x: e.clientX, y: e.clientY, comp: S.comp, moved: null };
});
vf.addEventListener('pointermove', e => {
  if (!vfPtr) return;
  const dx = e.clientX - vfPtr.x, dy = e.clientY - vfPtr.y;
  if (!vfPtr.moved && Math.hypot(dx, dy) > 10) vfPtr.moved = Math.abs(dy) > Math.abs(dx) ? 'v' : 'h';
  if (vfPtr.moved === 'v' && DIALS.ev.enabled()) {
    const c = clamp(vfPtr.comp - Math.round(dy / 14), -9, 9);
    if (c !== S.comp) { S.comp = c; schedule(); }
    af.classList.remove('dim'); clearTimeout(afTimer); afTimer = setTimeout(() => af.classList.add('dim'), 2000);
  }
});
vf.addEventListener('pointerup', e => {
  if (!vfPtr) return;
  const p = vfPtr; vfPtr = null;
  if (p.moved === 'h' && Math.abs(e.clientX - p.x) > 50) { stepMode(e.clientX < p.x ? 1 : -1); return; }
  if (p.moved) return;
  const rc = vf.getBoundingClientRect();
  const u = (e.clientX - rc.left) / rc.width, v = (e.clientY - rc.top) / rc.height;
  const cx = clamp(Math.round(u * W), 0, W - 1), cy = clamp(Math.round(v * H), 0, H - 1);
  let hit = LAYERS[0];
  for (const key of ['fore', 'person', 'fence', 'mid']) {
    const l = LAYERS.find(l => l.key === key);
    if (l.ctx.getImageData(cx, cy, 1, 1).data[3] > 40) { hit = l; break; }
  }
  S.focus = hit.d >= 1000 ? Infinity : hit.d;
  S.comp = DIALS.ev.enabled() ? 0 : S.comp;
  af.style.left = `${u * 100}%`; af.style.top = `${v * 100}%`;
  af.classList.remove('dim', 'pop'); void af.offsetWidth; af.classList.add('pop');
  clearTimeout(afTimer); afTimer = setTimeout(() => af.classList.add('dim'), 2000);
  schedule();
});
let lpTimer = 0;
vf.addEventListener('pointerdown', e => { if (e.target.closest('.overlay')) return; clearTimeout(lpTimer); lpTimer = setTimeout(() => { if (vfPtr && !vfPtr.moved) { $('afTag').hidden = false; setTimeout(() => $('afTag').hidden = true, 1800); } }, 650); });
vf.addEventListener('pointerup', () => clearTimeout(lpTimer));

// top bar buttons
$('flashBtn').addEventListener('click', () => {
  S.flash = !S.flash;
  $('flashBtn').classList.toggle('on', S.flash); $('flashBtn').setAttribute('aria-pressed', S.flash);
  toast(S.flash ? 'Вспышка вкл.' : 'Вспышка выкл.'); schedule();
});
$('histBtn').addEventListener('click', () => {
  const h = $('histo'); h.hidden = !h.hidden;
  $('histBtn').classList.toggle('on', !h.hidden); $('histBtn').setAttribute('aria-pressed', !h.hidden); schedule();
});
$('cycleBtn').addEventListener('click', () => {
  S.light = LIGHT_KEYS[(LIGHT_KEYS.indexOf(S.light) + 1) % LIGHT_KEYS.length];
  toast(`${LIGHTS[S.light].name} · EV ${LIGHTS[S.light].ev}`); schedule();
});

let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1400); }

// ---------- per-frame UI ----------
function updateUI(r) {
  const P = prog();
  const aT = P === 'Av' || P === 'P', aN = P === 'Tv' || P === 'P';
  const o = r.offset, bad = Math.abs(o) > .6;
  $('readout').innerHTML =
    `<span class="${aT ? 'auto' : ''}">${fmtT(r.t)}</span><span class="${aN ? 'auto' : ''}">${fmtN(r.N)}</span>` +
    `<span class="${S.autoIso ? 'auto' : ''}">ISO ${r.iso}</span><span>${S.focal} мм</span>` +
    `<span class="meter${bad ? ' bad' : ''}">${o > -.05 ? '+' : '−'}${Math.abs(o).toFixed(1)} EV</span>`;
  $('sun').style.top = `${clamp(50 - S.comp * 5, 0, 100)}%`;
  syncZoom(); syncTools(); updateDial(false);

  let hint = '';
  if (o > 1.7) hint = '<b>Пересвет.</b> Короче выдержка, закрыть диафрагму или ниже ISO';
  else if (o < -1.7) hint = '<b>Недосвет.</b> Длиннее выдержка, открыть диафрагму или выше ISO';
  else if ((info.motion || 0) > 3) {
    const need = SHUTTERS.find(t => S.focal * SPEEDS[S.speed].v * t / SUBJECT_D * PXMM < 2) || 1 / 8000;
    hint = `<b>Смаз движения.</b> Нужна выдержка ${fmtT(need)} или короче`;
  }
  else if (info.shake > 2) hint = `<b>Шевелёнка.</b> Выдержка длиннее 1/${S.focal} с — нужен штатив`;
  else if (info.person > 4) hint = '<b>Человек не в фокусе.</b> Коснитесь его на экране';
  else if (r.iso >= 3200) hint = `<b>Шум.</b> ISO ${r.iso}`;
  else if (S.mode === 'port' && info.far > 12) hint = 'Портрет · фон размыт';
  $('hint').innerHTML = hint; $('hint').hidden = !hint;
}
function drawHist(hist) {
  const c = $('histo'), x = c.getContext('2d'), w = c.width, h = c.height;
  x.clearRect(0, 0, w, h);
  let max = 1; for (let i = 1; i < 63; i++) max = Math.max(max, hist[i]);
  x.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 64; i++) { const v = Math.min(1, hist[i] / max) * (h - 12); x.fillRect(8 + i * (w - 16) / 64, h - 6 - v, (w - 16) / 64 - 1, v); }
}

// ---------- shooting + gallery ----------
const shots = [];
let gIdx = 0;
function shoot() {
  shakeAngle = Math.random() * Math.PI; grainSeed = (Math.random() * 1e9) | 0;
  render();
  const bo = $('blackout'); bo.classList.remove('go'); void bo.offsetWidth; bo.classList.add('go');
  shots.unshift({ src: view.toDataURL('image/jpeg', .9), cap: `${fmtT(last.t)} · ${fmtN(last.N)} · ISO ${last.iso} · ${S.focal} мм · ${LIGHTS[S.light].name}` });
  if (shots.length > 30) shots.pop();
  const ti = $('thumbImg'); ti.src = shots[0].src; ti.hidden = false;
  const tb = $('thumb'); tb.classList.remove('pop'); void tb.offsetWidth; tb.classList.add('pop');
}
function showGallery(i) {
  gIdx = i;
  $('gallery').hidden = false;
  $('gEmpty').hidden = shots.length > 0; $('gImg').hidden = !shots.length;
  $('gCount').textContent = shots.length ? `${i + 1} из ${shots.length}` : '';
  if (shots.length) { $('gImg').src = shots[i].src; $('gImg').alt = shots[i].cap; $('gCap').textContent = shots[i].cap; } else $('gCap').textContent = '';
  $('gStrip').innerHTML = shots.map((s, k) => `<button type="button" class="${k === i ? 'on' : ''}" data-i="${k}" aria-label="Снимок ${k + 1}"><img src="${s.src}" alt=""></button>`).join('');
}
$('shoot').addEventListener('click', shoot);
$('thumb').addEventListener('click', () => showGallery(0));
$('gDone').addEventListener('click', () => { $('gallery').hidden = true; });
$('gStrip').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showGallery(+b.dataset.i); });
document.addEventListener('keydown', e => {
  if (!$('gallery').hidden) {
    if (e.key === 'Escape') $('gallery').hidden = true;
    if (e.key === 'ArrowRight' && gIdx < shots.length - 1) showGallery(gIdx + 1);
    if (e.key === 'ArrowLeft' && gIdx > 0) showGallery(gIdx - 1);
    return;
  }
  if (document.activeElement === ruler) return;
  if (e.code === 'Space' || e.key === 'Enter' && document.activeElement === document.body) { e.preventDefault(); shoot(); }
});

render();
syncModes();
})();
</script>
