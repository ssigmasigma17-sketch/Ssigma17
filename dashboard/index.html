<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Житомир">
<title>Житомир — небо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b;--sheet:#101218;--card:#171a22;--card2:#1e222c;--line:rgba(255,255,255,.07);
  --txt:#f4f5f8;--mut:#8b93a4;--dim:#5d6475;
  --red:#ff3b3b;--green:#2fd67b;--amber:#ffb020;--blue:#4c8dff;--gray:#6b7280;
  --accent:var(--gray);
  --peek:150px;
  font-family:Manrope,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);overscroll-behavior:none}
body.on{--accent:var(--red)}body.on.yellow{--accent:var(--amber)}body.off{--accent:var(--green)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* map */
#map{position:fixed;left:0;right:0;top:0;height:calc(100dvh - var(--peek) + 26px);background:#0b0d12}
#map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#map .fallback{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;color:var(--mut);font-size:14px;padding:0 30px 26px}
#map .fallback a{color:var(--blue);font-weight:700;text-decoration:none}
#alarm{position:fixed;left:0;right:0;top:0;height:calc(100dvh - var(--peek) + 26px);pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 0 2px rgba(255,59,59,.85),inset 0 0 90px 10px rgba(255,59,59,.35)}
body.on.yellow #alarm{box-shadow:inset 0 0 0 2px rgba(255,176,32,.8),inset 0 0 90px 10px rgba(255,176,32,.28)}
body.on #alarm{opacity:1;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;height:84dvh;z-index:10;
  background:var(--sheet);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  box-shadow:0 -6px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;will-change:transform;
  transform:translateY(calc(84dvh - var(--peek)))}
#sheet::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(90% 140px at 50% 0,color-mix(in srgb,var(--accent) 22%,transparent),transparent);transition:background .4s}
#peek{position:relative;padding:8px 18px 12px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.handle{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:0 auto 12px}

.status{display:flex;align-items:center;gap:14px}
.orb{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);display:grid;place-items:center}
.orb i{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
body.on .orb::before,body.on .orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ping 2s cubic-bezier(0,.6,.4,1) infinite}
body.on .orb::after{animation-delay:1s}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.7);opacity:0}}
.st{flex:1;min-width:0}
.st h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
body.on .st h1{color:#ff6b6b}body.on.yellow .st h1{color:#ffc451}body.off .st h1{color:#5ee49b}
.st p{margin:3px 0 0;font-size:13.5px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{flex:none;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--mut)}
.gear svg{width:19px;height:19px}

.districts{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.districts::-webkit-scrollbar{display:none}
.dz{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;background:var(--card);font-size:12.5px;font-weight:700;color:var(--mut)}
.dz i{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.dz.on i{background:var(--red);box-shadow:0 0 8px var(--red)}.dz.on.yellow i{background:var(--amber);box-shadow:0 0 8px var(--amber)}.dz.off i{background:var(--green)}
.dz.on{color:var(--txt)}
.ticker{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:14px;background:var(--card);font-size:13.5px;font-weight:600;min-height:38px}
.ticker .k{flex:none}
.ticker span.x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker time{flex:none;color:var(--dim);font-size:12px}
.ticker.none{color:var(--dim)}

.k{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.k::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.course{--c:var(--amber)}.hit{--c:var(--red)}.pvo{--c:var(--blue)}

/* feed */
.seg{display:flex;margin:4px 18px 10px;padding:4px;background:var(--card);border-radius:14px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--mut);transition:background .2s,color .2s}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 12px rgba(0,0,0,.25)}
.seg b{font-size:11px;margin-left:5px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.07);font-weight:800}
.seg button.on b{background:var(--c);color:#111}

#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.ev{display:grid;grid-template-columns:46px 14px 1fr;gap:0 10px}
.ev .t{text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.ev .t b{display:block;font-size:14px;font-weight:800}
.ev .t span{font-size:11px;color:var(--dim);font-weight:600}
.ev .rail{position:relative;display:flex;justify-content:center}
.ev .rail::before{content:"";position:absolute;top:0;bottom:-2px;width:2px;background:var(--line)}
.ev:last-child .rail::before{bottom:auto;height:14px}
.ev .rail i{position:relative;margin-top:5px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--sheet),0 0 12px var(--c)}
.ev .c{padding-bottom:18px;min-width:0}
.ev p{margin:0;font-size:15px;line-height:1.45;white-space:pre-line;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ev.full p{-webkit-line-clamp:unset}
.ev a{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--dim);text-decoration:none}
.empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px;font-weight:600}
.empty div{font-size:30px;margin-bottom:8px;opacity:.6}
.foot{margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--dim);text-align:center}
.skel{height:58px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* settings */
#dlg{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
#dlg.show{display:grid}
#dlg .box{width:100%;max-width:420px;background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:20px}
#dlg h3{margin:0 0 4px;font-size:18px;font-weight:800}
#dlg p{margin:0 0 14px;font-size:13px;color:var(--mut)}
#dlg input{width:100%;font:inherit;font-size:15px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
#dlg input:focus{border-color:var(--blue)}
#dlg .row{display:flex;gap:8px;margin-top:14px}
#dlg .row button{flex:1;padding:12px;border-radius:12px;font-weight:800;background:var(--card)}
#dlg .row .pri{background:var(--blue);color:#fff}
</style>
</head>
<body>
<div id="map">
  <div class="fallback">Карта dimap.live не завантажилась<a href="https://dimap.live/" target="_blank" rel="noopener">Відкрити dimap.live</a></div>
  <iframe src="https://dimap.live/" title="Карта повітряних цілей dimap.live" allow="geolocation; fullscreen" referrerpolicy="no-referrer"></iframe>
</div>
<div id="alarm"></div>

<section id="sheet" aria-label="Обстановка">
  <div id="peek">
    <div class="handle"></div>
    <div class="status">
      <div class="orb"><i></i></div>
      <div class="st"><h1 id="title">Завантаження…</h1><p id="sub">Житомирська область</p></div>
      <button class="gear" id="gear" aria-label="Налаштування"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="districts" id="districts"></div>
    <div class="ticker none" id="ticker">Зачекайте, читаємо канали…</div>
  </div>
  <nav class="seg" id="seg">
    <button data-t="course" class="course on">Курс<b id="n-course">0</b></button>
    <button data-t="hit" class="hit">Влучання<b id="n-hit">0</b></button>
    <button data-t="pvo" class="pvo">ППО<b id="n-pvo">0</b></button>
  </nav>
  <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</section>

<div id="dlg"><div class="box">
  <h3>Джерело даних</h3>
  <p>Залиште порожнім — дані оновлюються автоматично щохвилини. Сюди можна вставити адресу власного Cloudflare Worker.</p>
  <input id="feed" placeholder="автоматично" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="row"><button id="cancel">Скасувати</button><button class="pri" id="save">Зберегти</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch{}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=iso=>new Date(iso).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
const mins=iso=>Math.max(0,Math.round((Date.now()-Date.parse(iso))/60000));
function ago(iso){const m=mins(iso);if(m<1)return 'щойно';if(m<60)return m+' хв';const h=Math.floor(m/60);return h<24?h+' год':Math.floor(h/24)+' д'}
function dur(iso){const m=mins(iso);if(m<60)return m+' хв';const h=Math.floor(m/60);return h<48?h+' год '+(m%60)+' хв':Math.floor(h/24)+' дн'}
const KIND={course:'Курс',hit:'Влучання',pvo:'ППО'};
const EMPTY={course:['🛰️','За останні 3 години повідомлень про курс немає'],hit:['🏠','За добу повідомлень про влучання немає'],pvo:['🛡️','За добу повідомлень про роботу ППО немає']};
let data={course:[],hit:[],pvo:[]},alert=null,tab='course',lastOn=null,loaded=false;

const q=new URLSearchParams(location.search).get('feed');
if(q){store.set('feed',q);history.replaceState(null,'',location.pathname)}
const feedUrl=()=>store.get('feed')||'events.json?t='+Date.now();

/* ---------- render ---------- */
const DISTRICTS=['Житомирський','Бердичівський','Коростенський','Звягельський'];
const SHORT={Житомирський:'Житомир',Бердичівський:'Бердичів',Коростенський:'Коростень',Звягельський:'Звягель'};
let districts={};
const lvl=a=>a&&a.state==='on'&&a.level==='жовтий'?' yellow':'';
function renderStatus(err){
  const b=document.body;
  if(err){b.className='';$('title').textContent='Немає зв’язку';$('sub').textContent='Перевірте інтернет · статус невідомий';return}
  if(!alert){b.className='';$('title').textContent='Статус невідомий';$('sub').textContent='Чекаємо на перше повідомлення про тривогу або відбій';}
  else{
    const on=alert.state==='on';b.className=(on?'on':'off')+lvl(alert);
    $('title').textContent=on?(alert.threat||'Повітряна тривога'):'Відбій тривоги';
    $('sub').textContent=on?(alert.level?alert.level[0].toUpperCase()+alert.level.slice(1)+' рівень · ':'Триває ')+dur(alert.since)+' · Житомирський р-н':'Тиша '+dur(alert.since)+' · з '+hm(alert.since);
    document.title=(on?'🔴 Тривога':'🟢 Відбій')+' — Житомир';
    if(lastOn!==null&&lastOn!==on&&navigator.vibrate)navigator.vibrate(on?[400,200,400,200,400]:[150]);
    lastOn=on;
  }
  const names=[...new Set([...DISTRICTS,...Object.keys(districts)])];
  $('districts').innerHTML=names.map(n=>{const a=districts[n];return `<span class="dz ${a?a.state:''}${lvl(a)}"><i></i>${esc(SHORT[n]||n)}</span>`}).join('');
}
function renderFeed(){
  for(const k in data)$('n-'+k).textContent=data[k].length;
  const all=[...data.course,...data.hit,...data.pvo].sort((a,b)=>b.time.localeCompare(a.time));
  const top=all[0],tk=$('ticker');
  if(!loaded)return;
  if(top&&mins(top.time)<180){tk.className='ticker';tk.innerHTML=`<span class="k ${top.type}">${KIND[top.type]}</span><span class="x">${esc(top.text.replace(/\s+/g,' '))}</span><time>${ago(top.time)}</time>`}
  else{tk.className='ticker none';tk.textContent='Спокійно — свіжих повідомлень немає'}
  const items=data[tab];
  $('list').innerHTML=(items.length?items.map((e,i)=>`<div class="ev ${e.type}" data-i="${i}"><div class="t"><b>${hm(e.time)}</b><span>${ago(e.time)}</span></div><div class="rail"><i></i></div><div class="c"><p>${esc(e.text)}</p><a href="${esc(e.url)}" target="_blank" rel="noopener">@${esc(e.channel)} ↗</a></div></div>`).join(''):`<div class="empty"><div>${EMPTY[tab][0]}</div>${EMPTY[tab][1]}</div>`)
    +'<p class="foot">Дані автоматично збираються з відкритих Telegram-каналів і можуть бути неточними. Це не офіційне оповіщення — орієнтуйтесь на сирени.</p>';
}
$('list').addEventListener('click',e=>{if(e.target.closest('a'))return;const ev=e.target.closest('.ev');if(ev)ev.classList.toggle('full')});
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));$('list').scrollTop=0;renderFeed()});

/* ---------- data ---------- */
async function load(){
  try{
    const r=await fetch(feedUrl(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json(),ev=d.events||[];
    alert=d.alert;districts=d.districts||{};loaded=true;
    data={course:ev.filter(e=>e.type==='course'&&mins(e.time)<180).slice(0,30),hit:ev.filter(e=>e.type==='hit').slice(0,30),pvo:ev.filter(e=>e.type==='pvo').slice(0,30)};
    renderStatus();renderFeed();
  }catch{renderStatus(true)}
}

/* ---------- bottom sheet ---------- */
const sheet=$('sheet'),peek=$('peek');let open=false;
function setPeek(){document.documentElement.style.setProperty('--peek',peek.offsetHeight+'px')}
const closedY=()=>sheet.offsetHeight-peek.offsetHeight;
function place(y,anim){sheet.style.transition=anim?'transform .42s cubic-bezier(.2,.9,.25,1)':'none';sheet.style.transform=`translateY(${y}px)`}
function snap(o){open=o;place(o?0:closedY(),true)}
let sy=null,base=0,moved=false,ly=0,lt=0,vel=0;
peek.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sy=ly=e.clientY;lt=e.timeStamp;vel=0;base=open?0:closedY();moved=false;peek.setPointerCapture(e.pointerId)});
peek.addEventListener('pointermove',e=>{if(sy===null)return;const dy=e.clientY-sy;if(Math.abs(dy)>5)moved=true;vel=(e.clientY-ly)/Math.max(1,e.timeStamp-lt);ly=e.clientY;lt=e.timeStamp;if(moved)place(Math.min(closedY(),Math.max(0,base+dy)),false)});
peek.addEventListener('pointerup',e=>{if(sy===null)return;const dy=e.clientY-sy;sy=null;if(!moved){snap(!open);return}snap(vel<-.3?true:vel>.3?false:base+dy<closedY()/2)});
peek.addEventListener('pointercancel',()=>{sy=null;snap(open)});
addEventListener('resize',()=>{setPeek();place(open?0:closedY(),false)});

/* ---------- settings ---------- */
$('gear').onclick=()=>{$('feed').value=store.get('feed')||'';$('dlg').classList.add('show')};
$('cancel').onclick=()=>$('dlg').classList.remove('show');
$('dlg').onclick=e=>{if(e.target.id==='dlg')$('dlg').classList.remove('show')};
$('save').onclick=()=>{store.set('feed',$('feed').value.trim());$('dlg').classList.remove('show');load()};

setPeek();place(closedY(),false);
load();setInterval(load,20000);setInterval(()=>{if(loaded){renderStatus();renderFeed()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</body>
</html>
