<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Житомир — тривога</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--txt:#eef0f4;--mut:#8d94a3;--ok:#1f9d55;--bad:#d62839;--warn:#e0a800;--line:#2a2e38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
h1{font-size:18px;margin:0}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#status{border-radius:20px;padding:28px 20px;text-align:center;background:var(--card);transition:background .3s}
#status.ok{background:var(--ok)}#status.bad{background:var(--bad);animation:pulse 1.6s infinite}#status.unk{background:#3a3f4b}
#status b{display:block;font-size:34px;letter-spacing:1px}
#status small{display:block;margin-top:6px;opacity:.9}
@keyframes pulse{50%{filter:brightness(1.25)}}
h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 8px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.card .meta{color:var(--mut);font-size:13px;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.tag{border-radius:6px;padding:0 7px;font-size:12px;font-weight:600;color:#fff}
.tag.hit{background:var(--bad)}.tag.pvo{background:#2f6fd6}.tag.air{background:var(--bad)}
.card p{margin:0;white-space:pre-line;word-break:break-word;font-size:15px}
a{color:#6ea8ff}
.empty,.note{color:var(--mut);font-size:14px}
#settings{display:none}#settings.show{display:block}
input{width:100%;font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 10px}
#err{color:#ff8a8a;font-size:14px;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<header><h1>Житомир · тривога</h1><button id="gear" aria-label="Налаштування">⚙︎</button></header>

<section id="settings" class="card">
  <label>Токен alerts.in.ua</label>
  <input id="token" type="password" autocomplete="off" placeholder="вставте токен">
  <label>Область (фільтр по назві)</label>
  <input id="region" value="Житомир">
  <label>Свій шлях до API (необов'язково, якщо браузер блокує запити)</label>
  <input id="base" placeholder="https://api.alerts.in.ua">
  <label>Адреса Cloudflare Worker (стрічка майже в реальному часі)</label>
  <input id="feed" placeholder="https://zhytomyr-events.xxx.workers.dev">
  <button id="save">Зберегти</button>
  <p class="note">Токен зберігається лише в цьому телефоні (localStorage) і не потрапляє в репозиторій.</p>
</section>

<div id="status" class="unk"><b>…</b><small>Завантаження</small></div>
<div id="err"></div>
<div id="alerts"></div>

<h2>Карта шахедів (dimap.live)</h2>
<div class="card">
  <a href="https://dimap.live/" target="_blank" rel="noopener"><button style="width:100%;font-weight:600">Відкрити карту dimap.live ↗</button></a>
  <button id="mapbtn" style="width:100%;margin-top:8px">Показати карту тут</button>
  <div id="mapbox" style="display:none;margin-top:8px"><iframe id="map" style="width:100%;height:70vh;border:0;border-radius:10px;background:#000" referrerpolicy="no-referrer" loading="lazy"></iframe>
  <p class="note">Якщо карта порожня — сайт забороняє показ усередині інших сторінок, відкрийте кнопкою вище.</p></div>
</div>
<h2>Влучання та вибухи</h2><div id="hits"></div>
<h2>Робота ПВО</h2><div id="pvo"></div>
<p class="note" id="src"></p>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const cfg=()=>({token:store.get('token')||'',region:store.get('region')||'Житомир',base:(store.get('base')||'https://api.alerts.in.ua').replace(/\/$/,'')});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const TYPES={air_raid:'Повітряна тривога',chemical:'Хімічна загроза',radiation:'Радіаційна загроза',urban_fights:'Міські бої',nuclear:'Ядерна загроза',other:'Інша загроза'};
let lastState=null;

function setStatus(cls,title,sub){const s=$('status');s.className=cls;s.innerHTML=`<b>${title}</b><small>${sub}</small>`;document.title=(cls==='bad'?'🔴 ':cls==='ok'?'🟢 ':'')+'Житомир — тривога'}

async function loadAlerts(){
  const c=cfg();
  if(!c.token){setStatus('unk','Немає токена','Відкрийте ⚙︎ і вставте токен');return}
  try{
    const r=await fetch(c.base+'/v1/alerts/active.json',{headers:{Authorization:'Bearer '+c.token},cache:'no-store'});
    if(r.status===401||r.status===403)throw new Error('Токен не підійшов ('+r.status+')');
    if(!r.ok)throw new Error('API відповіло '+r.status);
    const data=await r.json();
    const q=c.region.toLowerCase();
    const mine=(data.alerts||[]).filter(a=>(a.location_oblast||a.location_title||'').toLowerCase().includes(q)||(a.location_title||'').toLowerCase().includes(q));
    $('err').textContent='';
    const active=mine.length>0;
    if(active)setStatus('bad','ТРИВОГА',mine.map(a=>esc(a.location_title)).join(', '));
    else setStatus('ok','ТИХО','Активних тривог немає · оновлено '+new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}));
    $('alerts').innerHTML=mine.map(a=>`<div class="card"><div class="meta"><span class="tag air">${esc(TYPES[a.alert_type]||a.alert_type)}</span><span>з ${fmt(a.started_at)}</span></div><p>${esc(a.location_title)}${a.location_oblast?' · '+esc(a.location_oblast):''}</p></div>`).join('');
    if(lastState!==null&&lastState!==active&&navigator.vibrate)navigator.vibrate(active?[300,150,300,150,300]:[200]);
    lastState=active;
  }catch(e){
    setStatus('unk','Немає зв’язку','Статус невідомий');
    $('err').textContent=(e instanceof TypeError?'Запит заблоковано (мережа або CORS). Спробуйте свій шлях до API в ⚙︎.':e.message);
  }
}

function list(el,items,empty){
  $(el).innerHTML=items.length?items.map(e=>`<div class="card"><div class="meta"><span class="tag ${e.type}">${e.type==='hit'?'Влучання':'ПВО'}</span><span>${fmt(e.time)}</span><a href="${esc(e.url)}" target="_blank" rel="noopener">@${esc(e.channel)}</a></div><p>${esc(e.text)}</p></div>`).join(''):`<p class="empty">${empty}</p>`;
}
async function loadEvents(){
  try{
    const feed=store.get('feed');const r=await fetch(feed?feed:'events.json?t='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    const ev=d.events||[];
    list('hits',ev.filter(e=>e.type==='hit'),'За останню добу повідомлень немає.');
    list('pvo',ev.filter(e=>e.type==='pvo'),'За останню добу повідомлень немає.');
    $('src').textContent='Дані з відкритих Telegram-каналів, збираються автоматично і можуть бути неточними або запізнюватись.'+(d.updated?' Оновлено '+fmt(d.updated)+'.':'');
  }catch{list('hits',[],'Не вдалося завантажити.');list('pvo',[],'Не вдалося завантажити.')}
}

$('gear').onclick=()=>{$('settings').classList.toggle('show');const c=cfg();$('token').value=c.token;$('region').value=c.region;$('base').value=store.get('base')||'';$('feed').value=store.get('feed')||''};
$('save').onclick=()=>{store.set('token',$('token').value.trim());store.set('region',$('region').value.trim()||'Житомир');store.set('base',$('base').value.trim());store.set('feed',$('feed').value.trim());$('settings').classList.remove('show');lastState=null;loadAlerts()};
$('mapbtn').onclick=()=>{const m=$('map');if(!m.src)m.src='https://dimap.live/';const b=$('mapbox');const show=b.style.display==='none';b.style.display=show?'block':'none';$('mapbtn').textContent=show?'Сховати карту':'Показати карту тут'};
loadAlerts();loadEvents();
setInterval(loadAlerts,30000);setInterval(loadEvents,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadAlerts();loadEvents()}});
</script>
</body>
</html>
